name: Create Flow for Messenger app
on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string
      display_name:
        description: "App Name (Optional)"
        default: "Messenger"
        required: true
        type: string
      bundle_id:
        description: "BundleID (Optional)"
        default: "com.facebook.Messenger"
        required: true
        type: string
      remove_url_schemes:
        description: "Remove URL Schemes from Info.plist"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.1.1
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id,remove_url_schemes

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/messenger.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/messenger.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Extract version and process Info.plist
        run: |
          echo "==> Extracting version from Info.plist..."

          temp_dir=$(mktemp -d)
          cd "$temp_dir"

          # Extract IPA
          unzip -q "${{ github.workspace }}/messenger.ipa"

          # Locate .app dir inside Payload
          app_dir=$(find ./Payload -maxdepth 1 -name "*.app" -type d | head -1)
          if [[ -z "$app_dir" ]]; then
            echo "::error::.app directory not found in IPA"
            exit 1
          fi

          info_plist_path="$app_dir/Info.plist"
          if [[ ! -f "$info_plist_path" ]]; then
            echo "::error::Info.plist not found at $info_plist_path"
            exit 1
          fi
          echo "Found Info.plist at: $info_plist_path"

          # Extract version
          app_version=$(plutil -extract CFBundleShortVersionString raw "$info_plist_path" 2>/dev/null || echo "")
          if [[ -z "$app_version" ]]; then
            app_version=$(plutil -extract CFBundleVersion raw "$info_plist_path" 2>/dev/null || echo "unknown")
          fi
          echo "Extracted version: $app_version"
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV

          # Remove URL Schemes if requested
          if [[ "${{ inputs.remove_url_schemes }}" == "true" ]]; then
            echo "==> Removing URL Schemes from Info.plist..."
            if plutil -extract CFBundleURLTypes raw "$info_plist_path" >/dev/null 2>&1; then
              cp "$info_plist_path" "${info_plist_path}.bak"
              plutil -remove CFBundleURLTypes "$info_plist_path" || true
              if plutil -extract CFBundleURLTypes raw "$info_plist_path" >/dev/null 2>&1; then
                echo "⚠️ CFBundleURLTypes still exists after removal attempt"
              else
                echo "✅ Successfully removed CFBundleURLTypes"
              fi
            else
              echo "ℹ️ No CFBundleURLTypes found in Info.plist"
            fi

            echo "==> Recreating IPA with modified Info.plist..."
            zip -r -9 -q messenger_modified.ipa Payload/
            mv messenger_modified.ipa "${{ github.workspace }}/messenger.ipa"
          else
            echo "==> Skipping URL Schemes removal"
          fi

          cd "${{ github.workspace }}"
          rm -rf "$temp_dir"

      - name: Remove Swift Libraries from IPA
        run: |
          echo "==> Checking for Swift libraries..."
          swift_files=$(unzip -l messenger.ipa | grep -E "(libswift_Concurrency\.dylib|libswiftCore\.dylib)" | wc -l)
          if [ "$swift_files" -gt 0 ]; then
            temp_dir=$(mktemp -d)
            cd "$temp_dir"
            unzip -q "${{ github.workspace }}/messenger.ipa"
            find . -name "libswift_Concurrency.dylib" -delete
            find . -name "libswiftCore.dylib" -delete
            zip -r -9 -q messenger_cleaned.ipa Payload/
            mv messenger_cleaned.ipa "${{ github.workspace }}/messenger.ipa"
            cd "${{ github.workspace }}"
            rm -rf "$temp_dir"
            echo "✅ Swift libs removed"
          else
            echo "✅ No Swift libs found"
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download Flow for Messenger
        id: download_flow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_url="https://api.github.com/repos/dayanch96/Flow/releases/latest"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url" > /dev/null
          response=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" "$api_url")
          tag_name=$(echo "$response" | jq -r '.tag_name')
          deb_url=$(echo "$response" | jq -r '.assets[0].browser_download_url')
          if [[ "$deb_url" == "null" || -z "$deb_url" ]]; then
            echo "::error::Failed to get tweak URL"
            exit 1
          fi
          echo "FLOW_TAG=$tag_name" >> $GITHUB_ENV
          wget "$deb_url" --no-verbose -O ${{ github.workspace }}/flow_mess.deb

      - name: Inject tweaks into IPA
        run: cyan -i messenger.ipa -o Messenger_${{ env.APP_VERSION }}_Flow_${{ env.FLOW_TAG }}.ipa -uwef flow_mess.deb -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }} -s

      - name: Verify final IPA
        run: |
          echo "==> Final verification..."
          if [[ "${{ inputs.remove_url_schemes }}" == "true" ]]; then
            temp_verify=$(mktemp -d)
            cd "$temp_verify"
            unzip -q "${{ github.workspace }}/Messenger_${{ env.APP_VERSION }}_Flow_${{ env.FLOW_TAG }}.ipa"
            app_dir_final=$(find ./Payload -maxdepth 1 -name "*.app" -type d | head -1)
            info_plist_final="$app_dir_final/Info.plist"
            if plutil -extract CFBundleURLTypes raw "$info_plist_final" >/dev/null 2>&1; then
              echo "⚠️ CFBundleURLTypes still exists"
            else
              echo "✅ URL Schemes successfully removed in final IPA"
            fi
            cd "${{ github.workspace }}"
            rm -rf "$temp_verify"
          fi

      - uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: flow-mess-${{ env.FLOW_TAG }}
          name: Messenger_${{ env.APP_VERSION }}_Flow_${{ env.FLOW_TAG }}
          files: Messenger_${{ env.APP_VERSION }}_Flow_${{ env.FLOW_TAG }}.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
